name: Compilar Optimizador.exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Comprobar que los módulos cargan
        run: python -c "import optimizador.tweaks, optimizador.system_info, optimizador.ui.app"
      - name: Compilar
        run: python -m PyInstaller --noconfirm --onefile --windowed --uac-admin --name Optimizador --collect-all customtkinter main.py
      - uses: actions/upload-artifact@v4
        with:
          name: Optimizador
          path: dist/Optimizador.exe
